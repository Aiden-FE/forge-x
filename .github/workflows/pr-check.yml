name: Desktop PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs && node scripts/verify-release-config.mjs
      - run: pnpm build && pnpm test
      - run: pnpm exec playwright install --with-deps chrome webkit
      - run: pnpm test:e2e

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            bundles: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs && node scripts/verify-release-config.mjs
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - name: Verify macOS universal DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="src-tauri/target/universal-apple-darwin/release/bundle/dmg/ForgeX_$(node -p 'require("./package.json").version')_universal.dmg"
          test -s "$dmg"
          hdiutil attach "$dmg" -mountpoint "$RUNNER_TEMP/forgex" -nobrowse -quiet
          trap 'hdiutil detach "$RUNNER_TEMP/forgex" -quiet' EXIT
          app="$RUNNER_TEMP/forgex/ForgeX.app"
          test -d "$app"
          lipo -info "$app/Contents/MacOS/forgex" | tee "$RUNNER_TEMP/forgex-lipo.txt"
          grep -q x86_64 "$RUNNER_TEMP/forgex-lipo.txt"
          grep -q arm64 "$RUNNER_TEMP/forgex-lipo.txt"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -Eiq 'Signature[[:space:]]*=[[:space:]]*adhoc'
      - name: Verify unsigned Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS setup.exe, got $($installers.Count)" }
          if ((Get-AuthenticodeSignature $installers[0].FullName).Status -ne 'NotSigned') { throw 'NSIS must be unsigned in v1' }
