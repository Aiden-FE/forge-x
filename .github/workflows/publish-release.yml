name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing candidate tag (vX.Y.Z)
        required: true
        type: string
      candidate-run-id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string
      qa-evidence-url:
        description: Immutable raw GitHub QA evidence URL pinned to commit SHA
        required: true
        type: string
      qa-evidence-sha256:
        description: SHA-256 of the QA evidence file
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: identity
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_object=$(git rev-parse "refs/tags/$TAG")
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.conclusion' | grep -Fxq success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.path' | grep -Fq 'release.yml'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.event' | grep -Fxq push
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.head_branch' | grep -Fxq "$TAG"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.head_sha' | grep -Fxq "$commit"
          git checkout --detach "$commit"
          node scripts/check-version.mjs --require-tag "$TAG"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          run-id: ${{ inputs['candidate-run-id'] }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify candidate, QA evidence, and digests
        env:
          QA_EVIDENCE_URL: ${{ inputs['qa-evidence-url'] }}
          QA_EVIDENCE_SHA256: ${{ inputs['qa-evidence-sha256'] }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          TAG_OBJECT: ${{ steps.identity.outputs.tag_object }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
        run: |
          node scripts/release-artifacts.mjs verify release "$TAG" "$COMMIT" "$TAG_OBJECT" "$CANDIDATE_RUN_ID"
          node scripts/release-evidence.mjs create release-qa-evidence.json release/candidate-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-preflight
          path: |
            release
            release-qa-evidence.json
          if-no-files-found: error

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release-qa
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-preflight
          path: .
      - name: Require configured release QA reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release-qa" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers" and (.reviewers | length > 0))] | length' | grep -Eq '^[1-9][0-9]*$'
      - name: Acquire publication lease
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          tree=$(git rev-parse "$COMMIT^{tree}")
          owner=$(printf 'publication lease %s/%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RANDOM" | git commit-tree "$tree")
          echo "PUBLICATION_LEASE_OWNER=$owner" >> "$GITHUB_ENV"
          for attempt in $(seq 1 180); do
            if git push --force-with-lease=refs/heads/release-publication-lock: origin "$owner:refs/heads/release-publication-lock" 2>/dev/null; then
              echo 'PUBLICATION_LEASE_ACQUIRED=true' >> "$GITHUB_ENV"
              exit 0
            fi
            git fetch --no-tags origin +refs/heads/release-publication-lock:refs/remotes/origin/release-publication-lock 2>/dev/null || { sleep 10; continue; }
            old=$(git rev-parse refs/remotes/origin/release-publication-lock)
            message=$(git log -1 --format=%B "$old")
            if ! printf '%s' "$message" | grep -Eq '^publication lease ([0-9]+)/([0-9]+)/([0-9]+)$'; then sleep 10; continue; fi
            owner_run=$(printf '%s' "$message" | sed -E 's#^publication lease ([0-9]+)/([0-9]+)/.*#\1#')
            owner_time=$(git log -1 --format=%ct "$old")
            now=$(date +%s)
            if [ "$((now - owner_time))" -ge 2700 ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$owner_run" --jq .status) || { sleep 10; continue; }
              if [ "$state" = completed ] && git push --force-with-lease=refs/heads/release-publication-lock:$old origin "$owner:refs/heads/release-publication-lock"; then
                echo 'PUBLICATION_LEASE_ACQUIRED=true' >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 10
          done
          echo '::error::publication lease unavailable after 30 minutes'
          exit 1
      - name: Recheck tag, candidate, and reviewed QA
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          TAG_OBJECT: ${{ needs.preflight.outputs.tag_object }}
          CANDIDATE_RUN_ID: ${{ inputs['candidate-run-id'] }}
          QA_EVIDENCE_URL: ${{ inputs['qa-evidence-url'] }}
          QA_EVIDENCE_SHA256: ${{ inputs['qa-evidence-sha256'] }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/release-publication-lock:refs/remotes/origin/release-publication-lock
          test "$(git rev-parse refs/remotes/origin/release-publication-lock)" = "$PUBLICATION_LEASE_OWNER"
          git ls-remote --tags origin "refs/tags/$TAG" | cut -f1 | grep -Fxq "$TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$TAG")" = "$TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          node scripts/check-version.mjs --require-tag "$TAG"
          node scripts/release-artifacts.mjs verify release "$TAG" "$COMMIT" "$TAG_OBJECT" "$CANDIDATE_RUN_ID"
          node scripts/release-evidence.mjs validate release-qa-evidence.json release/candidate-manifest.json
      - name: Publish exact reviewed installers and checksums
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.commit }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/ForgeX_*.dmg
            release/ForgeX_*-setup.exe
            release/SHA256SUMS
          body: |
            ForgeX unsigned early-access desktop release.

            Windows 11 x64: current-user NSIS installer; SmartScreen may warn and Smart App Control or managed policy may block execution.
            The installer may need network access to download WebView2. Once installed, the tools run offline.
            macOS 14+: Universal DMG (Intel and Apple silicon), ad-hoc signed without Developer ID or notarization; Gatekeeper may warn or managed policy may block execution.
            Updates are manual from GitHub Releases; there is no in-app updater.
          draft: true
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" != true ]; then
            echo '::error::release is not a draft'; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | sort > published.txt
          printf '%s\n' "ForgeX_${version}_universal.dmg" "ForgeX_${version}_x64-setup.exe" SHA256SUMS | sort > expected.txt
          diff -u expected.txt published.txt
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f draft=false >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" = false
      - name: Release publication lease
        if: always() && env.PUBLICATION_LEASE_ACQUIRED == 'true'
        shell: bash
        run: git push --force-with-lease=refs/heads/release-publication-lock:$PUBLICATION_LEASE_OWNER origin :refs/heads/release-publication-lock
